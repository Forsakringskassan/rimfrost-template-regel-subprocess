# Packaging
quarkus.package.jar.type=fast-jar

#TODO specify the incoming kafka topic
mp.messaging.incoming.template-regel-responses.connector=smallrye-kafka
mp.messaging.incoming.template-regel-responses.auto.offset.reset=earliest
mp.messaging.incoming.template-regel-responses.group.id=${PROCESS_ID}-template-regel-responses-consumer
mp.messaging.incoming.template-regel-responses.topic=template-regel-responses
mp.messaging.incoming.template-regel-responses.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

#TODO specify the incoming kafka topic and group
mp.messaging.incoming.template-regel-komplettering-responses.connector=smallrye-kafka
mp.messaging.incoming.template-regel-komplettering-responses.auto.offset.reset=earliest
mp.messaging.incoming.template-regel-komplettering-responses.group.id=${PROCESS_ID}-template-regel-komplettering-responses-consumer
mp.messaging.incoming.template-regel-komplettering-responses.topic=template-regel-komplettering-responses
mp.messaging.incoming.template-regel-komplettering-responses.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

#TODO specify the outgoing kafka topic
mp.messaging.outgoing.template-regel-requests.connector=smallrye-kafka
mp.messaging.outgoing.template-regel-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.template-regel-komplettering-requests.connector=smallrye-kafka
mp.messaging.outgoing.template-regel-komplettering-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Sent after "Handle timeout" so OUL data for the handlaggning gets cleaned up
mp.messaging.outgoing.regel-oul-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.regel-oul-cancelled.topic=regel.oul.cancelled
mp.messaging.outgoing.regel-oul-cancelled.value.serializer=org.apache.kafka.common.serialization.StringSerializer
